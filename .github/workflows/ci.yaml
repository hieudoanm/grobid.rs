name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-build:
    name: CLI - Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: Run lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --verbose

      - name: Build binary
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: grobid-linux-amd64
          path: target/release/grobid
          retention-days: 7

  landing-build:
    name: Landing - Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.13.0"

      - name: Install pnpm
        run: corepack enable

      - name: Install dependencies
        working-directory: packages/landing
        run: pnpm install --frozen-lockfile

      - name: Run lint
        working-directory: packages/landing
        run: pnpm lint

      - name: Run tests
        working-directory: packages/landing
        run: pnpm test:run

      - name: Build
        working-directory: packages/landing
        run: pnpm build

      - name: Upload landing out artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: landing-out
          path: packages/landing/out
          retention-days: 1

  landing-deploy:
    name: Landing - Deploy
    needs: [landing-build]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Download landing out artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: landing-out
          path: packages/landing/out

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: packages/landing/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1

  cli-release:
    name: CLI - Release
    needs: [cli-build]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Read release notes from README.md
        id: readme
        run: |
          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat README.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Download binary
        uses: actions/download-artifact@v8.0.2
        with:
          name: grobid-linux-amd64
          path: dist

      - name: Delete existing "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          git push origin :refs/tags/latest || true

      - name: Create/Update "latest" Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: latest
          name: "Grobid CLI (latest)"
          body: ${{ steps.readme.outputs.body }}
          files: |
            dist/grobid
          draft: false
          prerelease: false
          make_latest: true
