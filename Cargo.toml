[workspace]
members = ["crates/grobid-core", "crates/grobid-cli"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Hieu Doan <hieu.doan.professional@gmail.com>"]

[workspace.dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
reqwest = { version = "=0.13.5", features = ["json", "multipart"] }
tokio = { version = "=1.54.1", features = ["full"] }
roxmltree = "=0.21.2"
anyhow = "=1.0.104"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "chrono"] }
chrono = "=0.4.45"
futures = "=0.3.34"
rusqlite = { version = "=0.41.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
urlencoding = "=2.1.3"
rmcp = { version = "=3.9.0", features = ["transport-io"] }
schemars = "=1.2.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
