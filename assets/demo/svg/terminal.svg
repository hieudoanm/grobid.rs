  <g font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace" font-size="20"><text x="44" y="126"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">grobid --version</tspan></text>  <text x="44" y="158" fill="#9ca3af">grobid.rs 0.1.0</text>  </g>  <g font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace" font-size="20"><text x="44" y="190"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">grobid search "stroke"</tspan></text>  <text x="44" y="222" fill="#9ca3af">3 papers matched</text>  <text x="44" y="254" fill="#c9a06a">  10.1000/xyz123 — Stroke recovery, 2021</text>  <text x="44" y="286" fill="#c9a06a">  10.1000/abc456 — Neuroplasticity, 2019</text>  </g>  <g font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace" font-size="20"><text x="44" y="318"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">grobid stats</tspan></text>  <text x="44" y="350" fill="#9ca3af">1,204 papers · 1987–2024</text>  <text x="44" y="382" fill="#7dd3a8">top author: J. Smith (42 papers)</text>  </g>  <g font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace" font-size="20"><text x="44" y="414"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">grobid graph</tspan></text>  <text x="44" y="446" fill="#7dd3a8">Wrote .grobid/index.html — open in a browser</text>  </g>  <g font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace" font-size="20"><text x="44" y="478"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">grobid mcp</tspan></text>  <text x="44" y="510" fill="#9ca3af">MCP server listening on stdio</text>  </g></svg>
